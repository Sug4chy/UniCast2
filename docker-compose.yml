services:

  seq:
    image: datalust/seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: Y
    volumes:
      - seq-data:/data
    networks:
      - uni-cast-network

  telegram-bot:
    image: sug4chy/unicast-telegram-bot
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      TelegramBot__Token: ${TelegramBot__Token}
      TelegramBot__Username: ${TelegramBot__Username}
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection}
      Moodle__BaseUrl: ${Moodle__BaseUrl}
      Moodle__IssuingMethodologistExtId: ${Moodle__IssuingMethodologistExtId}
      WEBHOOK_CERTIFICATE_PATH: "/certificates/public.pem"
      WEBHOOK_URL: ${WEBHOOK_URL}
      Seq__Url: ${Seq__Url}
    restart: on-failure
    volumes:
      - ./certificates.public.pem/:/certificates/public.pem
    depends_on:
      nginx:
        condition: service_started
      students-fetcher:
        condition: service_completed_successfully
    networks:
      - uni-cast-network

  internal-api:
    image: sug4chy/unicast-internal-api
    ports:
      - "5236:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      TelegramBot__Token: ${TelegramBot__Token}
      TelegramBot__Username: ${TelegramBot__Username}
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection}
      Seq__Url: ${Seq__Url}
    restart: on-failure
    networks:
      - uni-cast-network
    depends_on:
      students-fetcher:
        condition: service_completed_successfully

  students-fetcher:
    image: sug4chy/unicast-students-fetcher
    environment:
      MOODLE_BASE_URL: ${Moodle__BaseUrl}
      MOODLE_TOKEN: ${Moodle__WsAuthToken}
      CONNECTION_STRING: ${ConnectionStrings__DefaultConnection}
    networks:
      - uni-cast-network
    depends_on:
      migrator:
        condition: service_completed_successfully

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES__USER}
      POSTGRES_PASSWORD: ${Postgres__Password}
      POSTGRES_DB: ${Postgres__DB}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready", "-d", "postgres" ]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - uni-cast-network
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrator:
    image: sug4chy/unicast-migrator
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection}
    networks:
      - uni-cast-network
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certificates:~/certificates
    networks:
      - uni-cast-network
    ports:
      - "8443:443"

volumes:
  postgres-data:
  seq-data:

networks:
  uni-cast-network:
    driver: bridge